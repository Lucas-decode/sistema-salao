
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar serviço | Sistema Salão</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema Salão</h1>

        <nav>
            <a href="{{ url_for('auth.gerenciar_servicos') }}">Voltar</a>
            <a href="{{ url_for('auth.logout') }}">Sair</a>
        </nav>
    </header>

    <main>
        <h2>Editar serviço</h2>
        <p>Altere as informações do serviço selecionado.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="mensagem mensagem-{{ categoria }}">
                    <span>{{ mensagem }}</span>

                    <button
                        type="button"
                        class="fechar-mensagem"
                        aria-label="Fechar mensagem"
                    >&times;</button>
                </div>
            {% endfor %}
        {% endwith %}

        <section>
            <form method="POST">
                <label for="nome">Nome do serviço</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ servico.nome }}"
                    maxlength="100"
                    required
                >

                <label for="descricao">Descrição</label>
                <textarea
                    id="descricao"
                    name="descricao"
                    rows="3"
                >{{ servico.descricao or '' }}</textarea>

                <label for="comprimento">Comprimento do cabelo</label>
                <select name="comprimento" id="comprimento" required>
                    <option value="Curto"
                        {% if servico.comprimento == 'Curto' %}selected{% endif %}>
                        Curto
                    </option>

                    <option value="Médio"
                        {% if servico.comprimento == 'Médio' %}selected{% endif %}>
                        Médio
                    </option>

                    <option value="Comprido"
                        {% if servico.comprimento == 'Comprido' %}selected{% endif %}>
                        Comprido
                    </option>
                </select>

                <label for="preco">Preço (R$)</label>
                <input
                    type="number"
                    id="preco"
                    name="preco"
                    value="{{ servico.preco }}"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="duracao">Duração (minutos)</label>
                <input
                    type="number"
                    id="duracao"
                    name="duracao"
                    value="{{ servico.duracao_minutos }}"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Salvar alterações</button>
            </form>
        </section>
    </main>

    <script>
        document.querySelectorAll(".mensagem").forEach(function (mensagem) {
            const botaoFechar = mensagem.querySelector(".fechar-mensagem");
            let removida = false;

            function removerMensagem() {
                if (removida) return;

                removida = true;
                mensagem.classList.add("saindo");

                setTimeout(function () {
                    mensagem.remove();
                }, 400);
            }

            if (botaoFechar) {
                botaoFechar.addEventListener("click", removerMensagem);
            }

            setTimeout(removerMensagem, 4500);
        });
    </script>
</body>
</html>
